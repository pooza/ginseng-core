name: test
on:
  push:
  # ⚠ push 契機だけだと、更新が止まったときに赤へ気づけない。
  schedule:
    - cron: '25 0 * * 1'
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - ruby:3.3
          - ruby:3.4
          - ruby:4.0
    steps:
      - uses: actions/checkout@v5
      # ⚠ 手順の正本は pooza/ginseng-style。ここには matrix と schedule だけ置く。
      - uses: pooza/ginseng-style/.github/actions/ruby-check@main
        with:
          # ⚠ 証明書を持つのはこの gem だけ。取得してから鮮度を検査する。
          cert-update: 'true'
          cert-check: 'true'
          # ⚠⚠ 209 件のうち 13 件が、外部サーバー・シークレット（Slack / LINE）・
          # SMTP・ホストの /etc/cron.frequently に依存していて CI では通らない。
          # 方針が決まるまで保留する。詳細と選択肢は #520 にある。
          test: 'false'

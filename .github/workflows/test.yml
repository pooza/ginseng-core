name: test
on:
  push:
  # ⚠ push 契機だけだと、更新が止まったときに赤へ気づけない。
  # cert:check は cacert.pem が古くなると赤になるので、週次で検知したい。
  schedule:
    - cron: '25 0 * * 1'
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - ruby:3.3
          - ruby:3.4
          - ruby:4.0
    steps:
      - uses: actions/checkout@v5
      # ⚠ 手順の正本は pooza/ginseng-style。ここには matrix と schedule だけ置く。
      - uses: pooza/ginseng-style/.github/actions/ruby-check@main
        with:
          # ⚠ 証明書を持つのはこの gem だけ。⚠⚠ cert:update は CI では回さない。
          # cacert.pem をコミットして差分をレビューする設計（b9ddf32）。
          cert-check: 'true'
          # ⚠⚠ **2026-08-21 に test を有効化した (#508 / #520)。**
          # それまで 13 件が外部サーバー・シークレット・ホスト依存で通らず、
          # **この gem だけ CI がテストを走らせていなかった**（緑は lint が通った
          # 意味しか持たなかった）。⚠ シークレットを要する 6 件は omission として
          # 報告される — **落とさないが、走っていないことは隠さない。**

name: test
on:
  push:
  # ⚠ push 契機だけだと、更新が止まったときに赤へ気づけない。
  # cert:check は cacert.pem が古くなると赤になるので、週次で検知したい。
  schedule:
    - cron: '25 0 * * 1'
  # ⚠ schedule: は 60 日の無活動で GitHub に無効化される。ginseng-style の
  # gem-watch から起こせるようにしておく。
  workflow_dispatch:
# ⚠⚠ 手順本体は pooza/ginseng-style の composite action を @main で参照している。
# そこに入った変更が、このリポジトリの GITHUB_TOKEN を持って動く。既定に頼らず絞る。
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - ruby:3.3
          - ruby:3.4
          - ruby:4.0
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 既定では認証情報がワークツリーの git config に残る。依存 gem は
          # public な github: 参照なので、消しても bundle install に影響しない。
          persist-credentials: false
      # ⚠ 手順の正本は pooza/ginseng-style。ここには matrix と schedule だけ置く。
      - uses: pooza/ginseng-style/.github/actions/ruby-check@main
        with:
          # ⚠⚠ **鮮度確認はこのワークフローから外した (#515)。**
          # 古くなると `cert check` で落ち、**lint も test も skipped になって
          # その回の CI は何も検査しなくなる**（2026-08-13 に実際に発生。2 度目）。
          # ⚠ **「気付ける」と「CI が死ぬ」を分ける** — 追随は週次の cert.yml が
          # PR で知らせる。
          cert-check: 'false'
          # ⚠⚠ **2026-08-21 に test を有効化した (#508 / #520)。**
          # それまで 13 件が外部サーバー・シークレット・ホスト依存で通らず、
          # **この gem だけ CI がテストを走らせていなかった**（緑は lint が通った
          # 意味しか持たなかった）。⚠ シークレットを要する 6 件は omission として
          # 報告される — **落とさないが、走っていないことは隠さない。**

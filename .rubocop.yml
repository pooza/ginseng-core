# 正本は pooza/ginseng-style の config/rubocop.yml。ここには ginseng-core 固有の差分だけを書く。
# ⚠ 共通に見える緩和をここに足さないこと。共通化したい場合は pooza/ginseng-style に Issue を立てる。
# ⚠ `bundle exec rubocop` で実行すること（inherit_gem は gem のパス解決に Bundler を使う）。
inherit_gem:
  ginseng-style: config/rubocop.yml

AllCops:
  TargetRubyVersion: 3.4
# ⚠ この gem だけ frozen string literal のマジックコメントを要求する。
# 正本は Enabled: false（他のリポジトリは付けない）。
Style/FrozenStringLiteralComment:
  Enabled: true

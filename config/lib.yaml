package:
  version: 1.23.1
  url: https://github.com/pooza/ginseng-core
  authors:
    - Tatsuya Koishi
  email:
    - tkoishi@b-shock.co.jp
  description: ginseng core libraries
  license: MIT
environment: development
cert:
  url: https://curl.se/ca/cacert.pem
error:
  backtrace:
    level: 5
crypt:
  password: mulukhiya
  encoder: base64
http:
  retry:
    limit: 5
    seconds: 1
    # ⚠ 429 の Retry-After として受け入れる上限（秒）。これを超える待ちを
    # 指定されたら、待たずに諦めて呼び出し側へ返す (#525)。
    max_seconds: 60
  timeout:
    seconds: 30
line:
  token: null
  urls:
    api: https://api.line.me
  to: U00
logger:
  # ログに出す Hash の「キー名」で落とすもの。⚠ 利用側の
  # `/logger/mask_fields` は**この既定に足す**（減らせない。#586）。
  #
  # ⚠⚠ `code` / `i` / `key` は入れない — クエリのパラメータ名としては資格情報だが、
  # **Hash のキーとしては無関係な値が普通に入る**（mask_query_params との差はここ）。
  mask_fields:
    - access_token
    - api_key
    - apikey
    - authorization
    - client_secret
    - password
    - refresh_token
    - secret
    - token
  # URL のクエリに現れたら [FILTERED] へ落とすパラメータ
  # (pooza/mulukhiya-toot-proxy#4511)。mask_fields はキー名でしか判定できないので、
  # 値の文字列に埋まった資格情報はこちらで落とす。
  mask_query_params:
    - access_token
    - api_key
    - apikey
    - client_secret
    - code
    - i
    - key
    - password
    - refresh_token
    - secret
    - token
